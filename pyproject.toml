[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wraith"
version = "0.2.0"
description = "Offensive security orchestration framework — walks the kill-chain as a pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gustavo Almeida", email = "gustavoalm09@gmail.com" }]
keywords = ["security", "pentest", "offensive-security", "recon", "red-team", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]

# The core pipeline runs on the standard library alone.
dependencies = []

[project.optional-dependencies]
# Faster/cleaner HTTP probing; the http-probe phase falls back to urllib without it.
http = ["httpx>=0.27"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/gusta-ve/wraith"
Repository = "https://github.com/gusta-ve/wraith"
Issues = "https://github.com/gusta-ve/wraith/issues"
Changelog = "https://github.com/gusta-ve/wraith/blob/main/CHANGELOG.md"

[project.scripts]
wraith = "wraith.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wraith"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
